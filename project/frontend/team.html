<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team - DSA BUILDER</title>
    <link rel="icon" href="img/DSA.png" type="image/x-icon">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">


    <style>
        /* --- Premium Design System — Light Warm Theme --- */
        :root {
            --primary: #FFFDF9;
            --primary-light: #F7F3EE;
            --accent: #C9A86C;
            --accent-dark: #A6853A;
            --accent-glow: rgba(201, 168, 108, 0.35);
            --success: #2ECC71;
            --danger: #E74C3C;
            --text-main: #1A1A2E;
            --text-muted: #6B7280;
            --glass-bg: rgba(255, 253, 249, 0.92);
            --glass-border: rgba(201, 168, 108, 0.3);
            --card-bg: rgba(255, 253, 249, 0.97);
            --shadow-lg: 0 20px 60px rgba(26, 26, 46, 0.1);

            /* Typography */
            --font-heading: 'Playfair Display', serif;
            --font-body: 'DM Sans', sans-serif;

            /* Spacing & Radius */
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
        }

        /* --- Base & Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(ellipse at 15% 30%, rgba(201, 168, 108, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 70%, rgba(247, 243, 238, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            padding-top: 80px;
        }

        /* --- Navbar --- */
        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
        }

        .logo a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo img {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin: 2rem 0 1rem;
            color: var(--text-main);
            font-style: italic;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 4rem;
            font-size: 1.1rem;
        }

        .home-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 0 2rem 4rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .profile-card {
            position: relative;
            width: 300px;
            /* Slightly wider */
            height: 300px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 50%;
            box-shadow: var(--shadow-lg);
            transition: all 0.4s ease;
            margin: 20px;
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .profile-card:hover {
            border-radius: var(--radius-lg);
            height: 380px;
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 30px 60px rgba(201, 168, 108, 0.2);
        }

        .profile-card .img {
            position: relative;
            width: 100%;
            height: 100%;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card:hover .img {
            transform: translateY(-60px) scale(0.9);
        }

        .img img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            transition: all 0.4s;
            border: 4px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-card:hover img {
            border-radius: var(--radius-md);
            border-color: var(--accent);
        }

        .caption {
            text-align: center;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s;
            width: 100%;
        }

        .profile-card:hover .caption {
            opacity: 1;
            pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }

        .caption h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 0.5rem;
            white-space: nowrap;
        }

        .caption p {
            font-size: 1rem;
            font-weight: 400;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-links a {
            color: var(--text-muted);
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: var(--accent);
            transform: translateY(-3px);
        }

        @media (max-width: 1150px) {
            .home-container {
                flex-direction: column;
            }

            .profile-card {
                margin: 20px 0;
            }
        }
    </style>
</head>
