<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing - DSA Enterprise</title>
  <link rel="icon" type="image/x-icon" href="img/DSA.png">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* --- Premium Design System --- */
    :root {
      /* Palette */
      --primary: #0f172a;
      /* Slate 900 */
      --primary-light: #1e293b;
      /* Slate 800 */
      --accent: #3b82f6;
      /* Blue 500 */
      --accent-glow: rgba(59, 130, 246, 0.5);
      --success: #10b981;
      /* Emerald 500 */
      --danger: #ef4444;
      /* Red 500 */
      --text-main: #f8fafc;
      /* Slate 50 */
      --text-muted: #94a3b8;
      /* Slate 400 */

      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(30, 41, 59, 0.7);
      --input-bg: rgba(15, 23, 42, 0.6);

      /* Typography */
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;

      /* Spacing & Radius */
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 8px;
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* --- Base & Reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
      padding-top: 80px;
    }

    /* --- Navbar --- */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .logo img {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .back-btn {
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s;
      margin-right: 1rem;
    }

    .back-btn:hover {
      transform: translateX(-3px);
      color: var(--accent);
    }

    /* --- Content --- */
    h1 {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin: 3rem 0;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .plans-container {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 0 2rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 350px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .plan-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .badge {
      position: absolute;
      top: -15px;
      right: 20px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: white;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .plan-card h2 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    .plan-price {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .promo-text {
      color: var(--success);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      background: rgba(16, 185, 129, 0.1);
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      text-align: center;
    }

    .btn {
      margin-top: auto;
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-family: var(--font-heading);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
      filter: brightness(1.1);
    }

    /* Popup */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .popup.show {
      opacity: 1;
      visibility: visible;
    }

    .popup-content {
      background: var(--primary-light);
      padding: 2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      width: 90%;
      max-width: 400px;
      text-align: center;
      color: var(--text-main);
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .popup.show .popup-content {
      transform: scale(1);
    }

    .close-popup-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-popup-btn:hover {
      color: var(--text-main);
    }

    .popup-message {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .popup-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
        margin: 2rem 0;
      }

      .plans-container {
        padding: 0 1rem 2rem;
      }

      .logo span {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-arrow-left back-btn" onclick="history.back()"></i>
      <img src="img/DSA.png" alt="Logo">
      <span>DSA Enterprise</span>
    </div>
  </nav>

  <!-- ================= CONTENT ================= -->
  <h1>Choose Your Plan</h1>

  <div id="plans" class="plans-container"></div>

  <!-- Popup -->
  <div id="alert-popup" class="popup">
    <div class="popup-content">
      <button class="close-popup-btn" onclick="hidePopup()">&times;</button>
      <div class="popup-message"></div>
      <button class="popup-btn" onclick="hidePopup()">Close</button>
    </div>
  </div>

  <!-- ================= JS ================= -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module">
    import { RAZORPAY_KEY_ID } from './razorpayConfig.js';

    const plansContainer = document.getElementById("plans");
    const builderId = localStorage.getItem("builderId") || "guest_builder"; // Fallback for testing

    async function fetchPlans() {
      try {
        const response = await fetch('/api/plans');
        const plans = await response.json();
        renderPlans(plans);
      } catch (error) {
        console.error("Error fetching plans:", error);
        showPopup("Failed to load plans given by server. Please try again later.");
      }
    }

    function renderPlans(plans) {
      plansContainer.innerHTML = "";
      plans.forEach(plan => {
        const card = document.createElement("div");
        card.className = "plan-card";

        // Logic to highlighting popular plans or specific styling can be improved here
        if (plan.plan === "platinum") /* Example logic */ {
          card.innerHTML += `<div class="badge">Best Value</div>`;
        }

        const featuresHtml = plan.features ? plan.features.map(f => `<div>• ${f}</div>`).join('') : '';

        card.innerHTML += `
          <h2>${plan.plan.charAt(0).toUpperCase() + plan.plan.slice(1)} Plan</h2>
          <div class="plan-price">₹${plan.price.toLocaleString('en-IN')}</div>
          <p style="color:var(--text-muted); margin-bottom:1rem;">${plan.description || ''}</p>
          <div style="margin-bottom:1.5rem; text-align:left; color:var(--text-muted); font-size:0.9rem;">
            ${featuresHtml}
          </div>
          <button class="btn" onclick="initiatePayment('${plan.plan}')">
            Subscribe Now
          </button>
        `;

        plansContainer.appendChild(card);
      });
    }

    window.initiatePayment = async (planName) => {
      if (!builderId || builderId === "guest_builder") {
        // Try to get from user object if stored differently
        const user = JSON.parse(localStorage.getItem("user"));
        if (user && user._id) {
          // It's likely a user ID, but we need builderId. 
          // Assuming for now user._id is what we use or we need to fetch builder profile.
          // For now, prompt generic login if absolutely no ID.
        }
        // For this implementation, I will proceed but warn if it might fail on backend
        // Actually, backend needs builderId to update the builder. 
        // Let's assume the user is logged in as a builder and localStorage has 'user'
        const userData = localStorage.getItem("user");
        if (!userData) {
          showPopup("Please log in to subscribe.");
          setTimeout(() => window.location.href = 'login.html', 2000);
          return;
        }
        // We'll use the user's ID as builderId for the flow
        const headerBuilderId = JSON.parse(userData)._id;

        // Real implementation:
        createOrder(headerBuilderId, planName);
        return;
      }
      createOrder(builderId, planName);
    };

    async function createOrder(bId, planName) {
      try {
        const response = await fetch('/api/plans/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ builderId: bId, plan: planName })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.message || "Order creation failed");
        }

        const order = await response.json();
        handleRazorpay(order, bId, planName);

      } catch (error) {
        console.error("Order Error:", error);
        showPopup("Failed to initiate payment. " + error.message);
      }
    }

    function handleRazorpay(order, bId, planName) {
      const options = {
        key: RAZORPAY_KEY_ID,
        amount: order.amount,
        currency: order.currency,
        name: "DSA Enterprise",
        description: `Subscription for ${planName} plan`,
        order_id: order.id,
        handler: async function (response) {
          verifyPayment(response, bId, planName);
        },
        prefill: {
          name: "Builder Name", // Could fetch from user profile
          email: "builder@example.com",
          contact: "9999999999"
        },
        theme: {
          color: "#3b82f6"
        }
      };
      const rzp1 = new Razorpay(options);
      rzp1.open();
    }

    async function verifyPayment(paymentResponse, bId, planName) {
      try {
        const response = await fetch('/api/plans/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            razorpay_order_id: paymentResponse.razorpay_order_id,
            razorpay_payment_id: paymentResponse.razorpay_payment_id,
            razorpay_signature: paymentResponse.razorpay_signature,
            builderId: bId,
            plan: planName
          })
        });

        const result = await response.json();
        if (response.ok) {
          showPopup("Subscription Successful!");
          // Optionally redirect
          // window.location.href = 'dashboard.html';
        } else {
          showPopup("Payment verification failed: " + result.message);
        }
      } catch (error) {
        console.error("Verification Error:", error);
        showPopup("Payment verification failed due to network error.");
      }
    }

    function showPopup(message) {
      const popup = document.getElementById('alert-popup');
      const msg = popup.querySelector('.popup-message');
      msg.textContent = message;
      popup.classList.add('show');
    }

    window.hidePopup = function () {
      const popup = document.getElementById('alert-popup');
      popup.classList.remove('show');
    }

    // close when clicking overlay
    document.getElementById('alert-popup').addEventListener('click', (e) => {
      if (e.target.id === 'alert-popup') {
        hidePopup();
      }
    });

    // Initial load
    fetchPlans();
  </script>

</body>

</html>
