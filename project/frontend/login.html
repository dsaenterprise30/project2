<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="icon" href="img/DSA.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* --- Premium Design System --- */
    :root {
      /* Palette */
      --primary: #0f172a;
      /* Slate 900 */
      --primary-light: #1e293b;
      /* Slate 800 */
      --accent: #3b82f6;
      /* Blue 500 */
      --accent-glow: rgba(59, 130, 246, 0.5);
      --success: #10b981;
      /* Emerald 500 */
      --text-main: #f8fafc;
      /* Slate 50 */
      --text-dark: #f8fafc;
      /* Overriding for dark mode consistency */
      --text-muted: #94a3b8;
      /* Slate 400 */

      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(30, 41, 59, 0.7);
      --input-bg: rgba(15, 23, 42, 0.6);

      /* Typography */
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;

      /* Spacing & Radius */
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 8px;
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* --- Global & Layout Styles --- */
    body {
      font-family: var(--font-body);
      background-color: var(--primary);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .navbar .logo a {
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navbar .logo i {
      vertical-align: middle;
      color: var(--accent);
    }

    main {
      padding: 2.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      /* Adjust for navbar */
    }

    /* Center Container */
    .main-container {
      display: flex;
      width: 90%;
      max-width: 1000px;
      /* Slightly narrower for modern look */
      height: auto;
      min-height: 600px;
      background: var(--primary-light);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin: 0 auto;
    }

    /* Left Panel (Image) */
    .left-panel {
      width: 45%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
      padding: 3rem;
      background-image: url('img/image_login.webp');
      background-size: cover;
      background-position: center;
    }

    .background-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(59, 130, 246, 0.6));
      backdrop-filter: blur(2px);
    }

    .left-panel-content {
      position: relative;
      z-index: 1;
    }

    .left-panel h1 {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .left-panel p {
      font-size: 1.1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 0;
    }

    /* Right Panel (Form) */
    .right-panel {
      background-color: var(--primary-light);
      /* Dark theme bg */
      width: 55%;
      display: flex;
      align-items: center;
      position: relative;
      padding: 1rem;
    }

    .form-container {
      width: 100%;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-container h2 {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: var(--text-main);
      text-align: center;
    }

    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 1rem;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
      font-family: var(--font-body);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      outline: none;
      background: rgba(15, 23, 42, 0.8);
    }

    .phone-input {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .phone-input span {
      padding: 1rem;
      background: var(--glass-border);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      font-weight: 500;
      color: var(--text-muted);
    }

    .password-input-container {
      position: relative;
      width: 100%;
    }

    .password-input-container i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .password-input-container i:hover {
      color: var(--text-main);
    }

    .form-links {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: -0.5rem;
      margin-bottom: 1.5rem;
    }

    .form-links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .form-links a:hover {
      text-decoration: underline;
      color: #60a5fa;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #fff;
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      /* Pill shape */
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--accent-glow);
      margin-top: 1rem;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message-text {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .message-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .message-text a:hover {
      text-decoration: underline;
    }

    /* Pop-up Overlay styles */
    #custom-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1001;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .custom-popup-card {
      background-color: var(--primary-light);
      padding: 2.5rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
      width: 90%;
      max-width: 400px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
      color: var(--text-main);
    }

    .custom-popup-card h3 {
      font-family: var(--font-heading);
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    .custom-popup-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .popup-hidden {
      visibility: hidden;
      opacity: 0;
    }

    .popup-visible {
      visibility: visible;
      opacity: 1;
    }

    .custom-popup-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .custom-popup-buttons .btn {
      width: auto;
      min-width: 120px;
      margin-top: 0;
    }

    #popup-close-btn {
      background: transparent;
      border: 2px solid var(--glass-border);
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        width: 95%;
        border-radius: var(--radius-md);
        height: auto;
      }

      .left-panel {
        width: 100%;
        height: 250px;
        padding: 2rem;
      }

      .left-panel h1 {
        font-size: 2rem;
      }

      .right-panel {
        width: 100%;
      }

      .form-container {
        padding: 2rem;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <a href="index.html">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </div>
  </nav>


  <main>
    <div class="main-container">
      <div class="left-panel">
        <div class="background-overlay"></div>
        <div class="left-panel-content">
          <h1>Admin Access</h1>
          <p>Login with your credentials to access the dashboard.</p>
        </div>
      </div>
      <div class="right-panel">
        <div class="form-container">
          <h2>Admin Login</h2>
          <form id="loginForm">
            <div class="input-group">
              <label for="mobile">Mobile Number</label>
              <div class="phone-input">
                <span>+91</span>
                <input type="tel" id="mobileNumber" name="mobile" placeholder="Enter your mobile number" required
                  pattern="^[6-9]\d{9}$">
              </div>
            </div>
            <div class="input-group">
              <label for="password">Password</label>
              <div class="password-input-container">
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <i class="fa-solid fa-eye-slash toggle-password"></i>
              </div>
            </div>
            <div id="popupMessage"></div>
            <button type="submit" class="btn">Login</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="custom-popup-overlay" class="popup-hidden">
    <div class="custom-popup-card">
      <div class="custom-popup-content">
        <h3 id="popup-title"></h3>
        <p id="popup-message"></p>
        <i class="fa-solid fa-check-circle" id="success-icon"
          style="font-size: 2rem; color: #28a745; display: none;"></i>
        <i class="fa-solid fa-times-circle" id="error-icon" style="font-size: 2rem; color: #dc3545; display: none;"></i>
      </div>
      <div class="custom-popup-buttons">
        <button id="popup-ok-btn" class="btn">OK</button>
        <button id="popup-close-btn" class="btn">Close</button>
      </div>
    </div>
  </div>


  <script>
    function showCustomPopup(message, title = "Notification", onOk = null, showClose = false) {
      const overlay = document.getElementById('custom-popup-overlay');
      const popupTitle = document.getElementById('popup-title');
      const popupMessage = document.getElementById('popup-message');
      const okBtn = document.getElementById('popup-ok-btn');
      const closeBtn = document.getElementById('popup-close-btn');
      const successIcon = document.getElementById('success-icon');
      const errorIcon = document.getElementById('error-icon');

      popupTitle.textContent = title;
      popupMessage.textContent = message;

      successIcon.style.display = title === "Success" ? "block" : "none";
      errorIcon.style.display = title === "Error" ? "block" : "none";

      closeBtn.style.display = showClose ? 'inline-block' : 'none';

      okBtn.onclick = () => {
        if (onOk) onOk();
        hideCustomPopup();
      };

      closeBtn.onclick = () => {
        hideCustomPopup();
      };

      overlay.classList.remove('popup-hidden');
      overlay.classList.add('popup-visible');
      document.querySelector('.custom-popup-card').style.transform = 'scale(1)';
    }

    function hideCustomPopup() {
      const overlay = document.getElementById('custom-popup-overlay');
      overlay.classList.remove('popup-visible');
      overlay.classList.add('popup-hidden');
      document.querySelector('.custom-popup-card').style.transform = 'scale(0.9)';
    }

    // Inject Config
  </script>
  <script type="module">
    import { API_BASE_URL } from './config.js';
    window.API_BASE_URL = API_BASE_URL;
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('password');
      const togglePassword = document.querySelector('.toggle-password');

      // Corrected logic to ensure only one icon class is present
      if (passwordInput.type === 'password') {
        togglePassword.classList.add('fa-eye-slash');
        togglePassword.classList.remove('fa-eye');
      } else {
        togglePassword.classList.add('fa-eye');
        togglePassword.classList.remove('fa-eye-slash');
      }

      togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        togglePassword.classList.toggle('fa-eye');
        togglePassword.classList.toggle('fa-eye-slash');
      });

      const adminLoginForm = document.getElementById('loginForm');
      adminLoginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const mobile = document.getElementById('mobileNumber').value;
        const pass = document.getElementById('password').value;

        try {
          const response = await fetch(`${window.API_BASE_URL}/api/users/admin-login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mobileNumber: "+91" + mobile, password: pass })
          });

          const data = await response.json();

          if (response.ok && data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("admin", JSON.stringify(data.data));
            showCustomPopup("✅ Admin Logged-in successfully!", "Success", () => {
              window.location.href = "admin-dashboard.html";
            });
          } else {
            showCustomPopup(data.message || "⚠️ Invalid login credentials", "Error");
          }
        } catch (error) {
          console.error("Error:", error.message);
          showCustomPopup(`❌ Error: ${error.message}. Check console for details.`, "Error");
        }
      });
    });
    function showCustomPopup(message, title = "Notification", onOk = null, showClose = false) {
      const overlay = document.getElementById('custom-popup-overlay');
      const popupTitle = document.getElementById('popup-title');
      const popupMessage = document.getElementById('popup-message');
      const okBtn = document.getElementById('popup-ok-btn');
      const closeBtn = document.getElementById('popup-close-btn');

      popupTitle.textContent = title;
      popupMessage.textContent = message;

      closeBtn.style.display = showClose ? 'inline-block' : 'none';
      okBtn.textContent = (onOk && showClose) ? "Continue" : "OK";
      closeBtn.textContent = "Discard";

      okBtn.onclick = null;
      closeBtn.onclick = null;

      okBtn.onclick = () => {
        if (onOk) {
          hideCustomPopup();
          onOk();
        } else {
          hideCustomPopup();
        }
      };

      closeBtn.onclick = () => {
        hideCustomPopup();
        renderLoginForm();
      };

      overlay.classList.remove('popup-hidden');
      overlay.classList.add('popup-visible');
      document.querySelector('.custom-popup-card').style.transform = 'scale(1)';
    }

    function hideCustomPopup() {
      const overlay = document.getElementById('custom-popup-overlay');
      overlay.classList.remove('popup-visible');
      overlay.classList.add('popup-hidden');
      document.querySelector('.custom-popup-card').style.transform = 'scale(0.9)';
    }

  </script>
</body>

</html>
