<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing - DSA Enterprise</title>
  <link rel="icon" type="image/x-icon" href="img/DSA.png">

  <!-- Razorpay Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">


  <style>
    /* --- Premium Design System --- */
    :root {
      /* Palette */
      --primary: #0f172a;
      /* Slate 900 */
      --primary-light: #1e293b;
      /* Slate 800 */
      --accent: #3b82f6;
      /* Blue 500 */
      --accent-glow: rgba(59, 130, 246, 0.5);
      --success: #10b981;
      /* Emerald 500 */
      --danger: #ef4444;
      /* Red 500 */
      --text-main: #f8fafc;
      /* Slate 50 */
      --text-muted: #94a3b8;
      /* Slate 400 */

      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(30, 41, 59, 0.7);
      --input-bg: rgba(15, 23, 42, 0.6);

      /* Typography */
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;

      /* Spacing & Radius */
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 8px;
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* --- Base & Reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
      padding-top: 80px;
      /* Space for fixed navbar */
    }

    /* --- Navbar --- */
    .navbar {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .logo a {
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo img {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 2rem;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 4rem;
      font-size: 1.1rem;
    }

    /* --- Plans Container --- */
    .plans-container {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 0 2rem;
      max-width: 1200px;
      margin: 0 auto 4rem;
    }

    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 350px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(10px);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .plan-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .badge {
      position: absolute;
      top: -15px;
      right: 20px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: white;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .plan-card h2 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-main);
    }

    .plan-price {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .price-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .original-price {
      text-decoration: line-through;
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .discounted-price {
      color: var(--text-main);
    }

    .price-interval {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .promo-text {
      color: var(--success);
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .btn {
      margin-top: auto;
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-family: var(--font-heading);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
      filter: brightness(1.1);
    }

    .btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .plans-container {
        padding: 0 1rem;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <a onclick="history.back()" style="cursor: pointer; margin-right: 0.5rem;">
        <i class="fas fa-arrow-left"></i>
      </a>
      <a>
        <img src="img/DSA.png" alt="Logo">
        <span>DSA Enterprise</span>
      </a>
    </div>
  </nav>

  <h1>Simple, Transparent Pricing</h1>
  <p class="subtitle">Choose the perfect plan for your property needs.</p>

  <div id="plans" class="plans-container">
    <!-- Plans will load here -->
    <div style="color: var(--text-muted); width: 100%; text-align: center; padding: 2rem;">Loading plans...</div>
  </div>

  <!-- ================= JS ================= -->
  <script type="module">
    import { RAZORPAY_KEY_ID } from './razorpayConfig.js';
    import { API_BASE_URL } from "./config.js";

    const plansContainer = document.getElementById("plans");

    // If redirected with ?mobile=, persist it to localStorage for the subscribe flow
    const params = new URLSearchParams(window.location.search);
    const incomingMobile = params.get('mobile');
    if (incomingMobile) localStorage.setItem('userMobileNumber', incomingMobile);

    async function loadPlans() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/plans`);
        if (!res.ok) throw new Error('Failed to fetch plans');
        const plans = await res.json();

        plansContainer.innerHTML = "";

        const baselineMonthlyPlan = plans.find(p => p.duration === 1 && p.interval === "monthly");
        const baselineMonthlyPrice = baselineMonthlyPlan ? baselineMonthlyPlan.price : null;

        plans.forEach(plan => {
          const card = document.createElement("div");
          card.className = "plan-card";

          if (plan.planType === "YEARLY") {
            card.innerHTML += `<div class="badge">Most Popular</div>`;
          }

          const monthsTotal = plan.interval === 'yearly' ? (plan.duration * 12) : plan.duration;
          const originalPrice = baselineMonthlyPrice ? baselineMonthlyPrice * monthsTotal : plan.price;
          const discountedPrice = plan.price;

          // Show interval label based on plan duration/interval
          const intervalLabel = (plan.interval === 'monthly')
            ? (plan.duration > 1 ? `/ ${plan.duration} months` : '/ month')
            : (plan.duration > 1 ? `/ ${plan.duration} years` : '/ year');

          const freeMonths = baselineMonthlyPrice ? Math.max(0, Math.round((originalPrice - discountedPrice) / baselineMonthlyPrice)) : 0;
          const buyMonths = Math.max(monthsTotal - freeMonths, 0);
          const promoText = plan.description ? plan.description : (freeMonths >= 1 ? `Buy ${buyMonths} get ${freeMonths} free!` : '');

          card.innerHTML += `
          <h2>${plan.name}</h2>
          <div class="plan-price">
             <div class="price-block">
                ${discountedPrice < originalPrice ? `<span class="original-price">₹${originalPrice.toLocaleString('en-IN')}</span>` : ''}
                <div>
                    <span class="discounted-price">₹${discountedPrice.toLocaleString('en-IN')}</span>
                    <span class="price-interval">${intervalLabel}</span>
                </div>
             </div>
          </div>
          ${promoText ? `<div class="promo-text">${promoText}</div>` : ''}
          <button class="btn">Subscribe Now</button>
        `;

          const btn = card.querySelector(".btn");
          btn.addEventListener("click", () => subscribe(plan.planType, btn));

          plansContainer.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        plansContainer.innerHTML = `<div style="color: var(--danger); width: 100%; text-align: center; padding: 2rem;">Failed to load plans. Please try again later.</div>`;
      }
    }

    async function subscribe(planType, btn) {
      btn.disabled = true;
      const originalText = btn.innerText;
      btn.innerText = "Processing...";

      // Support both keys depending on where we saved it
      const mobileNumber = localStorage.getItem("userMobileNumber") || localStorage.getItem("mobileNumber");
      if (!mobileNumber) {
        alert("Please login or register first");
        btn.disabled = false;
        btn.innerText = originalText;
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}/api/payment/create-subscription`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mobileNumber, planType }),
        });

        const data = await res.json();
        if (!res.ok) {
          alert(data.message || "Subscription failed");
          btn.disabled = false;
          btn.innerText = originalText;
          return;
        }

        const rzp = new Razorpay({
          key: RAZORPAY_KEY_ID,
          subscription_id: data.subscriptionId,
          name: "DSA Enterprise",
          description: "Premium Subscription",
          image: "img/DSA.png",
          handler: function (response) {
            // You can verify payment here if needed
            alert("Payment successful! You are now subscribed.");
            window.location.href = "housingProperties.html"; // Redirect to dashboard
          },
          modal: {
            ondismiss: function () {
              btn.disabled = false;
              btn.innerText = originalText;
            }
          }
        });

        rzp.open();
      } catch (error) {
        console.error(error);
        alert("An error occurred. Please try again.");
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }

    loadPlans();

    // Make subscribe globally available if needed (though it's bound via event listener above)
    window.subscribe = subscribe;
  </script>

</body>

</html>
